name: Collect JRA odds

on:
  schedule:
    # 土日限定にすると祝日の振替開催(月曜開催等)を取りこぼすため、平日は
    # 当日開催ゼロを検出して即終了する運用にする。パブリックリポジトリで
    # 標準ランナー無料枠は実質無制限のため平日分のコストは無視できる。
    #
    # 経緯(詳細はcollector.py冒頭):
    # - 2026-09-05/06: am/pm 2分割は、pmトリガーのcron遅延が4時間超で収集0件
    # - 2026-09-12/13: 1日1ジョブは、GitHub Actionsのジョブ実行時間上限(実測6時間)で
    #   午後の終盤を取りこぼした
    # - 2026-09-19: 2つ目のcron(01:00 UTC)が4.5時間遅延し、1つ目のジョブの終了
    #   (13:50)との間に45分の空白ができた。cron遅延は予測できないため、cronは
    #   1本だけにして、ジョブ自身が5時間30分経過時に後継をworkflow_dispatchで
    #   起動する「リレー方式」にした
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      relay_test:
        description: "リレー動作確認用(2分後に後継を起動し4分で終了する)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # リレーで自分自身のworkflow_dispatchを呼ぶために必要

jobs:
  collect:
    runs-on: ubuntu-latest
    # ジョブ自体の安全弁。リレーは5時間45分で引き継ぐので、6時間上限より前に収まる。
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ODDS_SPREADSHEET_ID: ${{ secrets.ODDS_SPREADSHEET_ID }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          RELAY_DISPATCH_SEC: ${{ inputs.relay_test && '120' || '' }}
          RELAY_STOP_SEC: ${{ inputs.relay_test && '240' || '' }}
        run: python collector.py

      - name: Archive raw HTML
        if: always()
        run: |
          if [ -d raw_html ]; then
            tar -czf raw_html_$(date +%Y%m%d_%H%M).tar.gz raw_html
          fi

      - name: Upload raw HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html-${{ github.run_id }}
          path: raw_html_*.tar.gz
          retention-days: 90
          if-no-files-found: ignore
