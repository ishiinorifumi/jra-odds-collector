name: Collect JRA odds

on:
  schedule:
    # 土日限定にすると祝日の振替開催(月曜開催等)を取りこぼすため、平日は
    # 当日開催ゼロを検出して即終了する運用にする。パブリックリポジトリで
    # 標準ランナー無料枠は実質無制限のため平日分のコストは無視できる。
    #
    # 2026-09-05/06: am/pm 2分割(8:00/13:00 JST起動)は、pmトリガー
    # (4:00 UTC)のcron遅延が平均4.1〜4.4時間に達し実開始が17時台(全レース
    # 終了後)になって2日間とも収集0件だった。1日1回・6:00 JST起動・
    # 全日ウィンドウに統合して解消
    # 2026-09-12/13: 上記の1日1回統合方式で、GitHub Actions側にtimeout-minutes
    # 設定とは別の「ジョブ実行時間の暗黙の上限(実測ちょうど6時間)」がある
    # ことが判明。6:00起動+遅延で実開始7:55頃→6時間後の13:55に強制終了され、
    # 24レース中4〜5レースの終盤(15時台以降の重賞含む)を取りこぼした
    # (それ以外は561件/日をエラーなく取得できていた)。
    #
    # 6時間上限に収まりつつ全日をカバーするため、UTC 21:00と01:00の2トリガー
    # (約4時間差)に戻す。collector.py側で各ジョブの担当ウィンドウ開始を
    # 「自分の実起動時刻」(固定時刻ではない)にしているため、cron遅延の
    # 大小によらず2ジョブの担当範囲が自然につながる設計。
    - cron: "0 21 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub Actions側の実測ハード上限(6時間)を超えても無意味なため、
    # 自前のtimeout-minutesはそれより少し短い355分に設定する。
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ODDS_SPREADSHEET_ID: ${{ secrets.ODDS_SPREADSHEET_ID }}
        run: python collector.py

      - name: Archive raw HTML
        if: always()
        run: |
          if [ -d raw_html ]; then
            tar -czf raw_html_$(date +%Y%m%d_%H%M).tar.gz raw_html
          fi

      - name: Upload raw HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html-${{ github.run_id }}
          path: raw_html_*.tar.gz
          retention-days: 90
          if-no-files-found: ignore
