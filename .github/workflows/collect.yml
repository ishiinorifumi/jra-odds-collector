name: Collect JRA odds

on:
  # 起動元はGoogle Apps Scriptの時間主導型トリガー(毎日6:30 JST前後)が、
  # このワークフローのworkflow_dispatchをGitHub REST APIで呼ぶ方式。
  # GitHub Actions自身のcron(schedule)は使わない。cronは遅延が予測できない
  # (実測1.6〜4.5時間)のに対し、workflow_dispatchの起動遅延は数秒。
  #
  # 経緯(詳細はcollector.py冒頭):
  # - 2026-09-05/06: am/pm 2分割は、pmトリガーのcron遅延が4時間超で収集0件
  # - 2026-09-12/13: 1日1ジョブは、GitHub Actionsのジョブ実行時間上限(実測6時間)で
  #   午後の終盤を取りこぼした
  # - 2026-09-19: 2つ目のcron(01:00 UTC)が4.5時間遅延し、1つ目のジョブの終了
  #   (13:50)との間に45分の空白ができた。ジョブ自身が5時間30分経過時に後継を
  #   workflow_dispatchで起動する「リレー方式」にした
  # - 2026-09-20: 最初の1本の起動もcronに頼らずGASに移した(cronを削除)
  #
  # 手動で起動したい場合はActionsタブの"Run workflow"、またはGASの
  # dispatchCollectorを実行する。cronを復活させる場合はGASトリガーを必ず止めること
  # (両方動くと全項目が重複する)。
  workflow_dispatch:
    inputs:
      relay_test:
        description: "リレー動作確認用(2分後に後継を起動し4分で終了する)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # リレーで自分自身のworkflow_dispatchを呼ぶために必要

jobs:
  collect:
    runs-on: ubuntu-latest
    # ジョブ自体の安全弁。リレーは5時間45分で引き継ぐので、6時間上限より前に収まる。
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ODDS_SPREADSHEET_ID: ${{ secrets.ODDS_SPREADSHEET_ID }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          RELAY_DISPATCH_SEC: ${{ inputs.relay_test && '120' || '' }}
          RELAY_STOP_SEC: ${{ inputs.relay_test && '240' || '' }}
        run: python collector.py

      - name: Archive raw HTML
        if: always()
        run: |
          if [ -d raw_html ]; then
            tar -czf raw_html_$(date +%Y%m%d_%H%M).tar.gz raw_html
          fi

      - name: Upload raw HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html-${{ github.run_id }}
          path: raw_html_*.tar.gz
          retention-days: 90
          if-no-files-found: ignore
