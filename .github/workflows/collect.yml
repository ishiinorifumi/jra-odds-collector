name: Collect JRA odds

on:
  schedule:
    # 毎日 8:00 / 13:00 JST に起動 (UTC = JST-9)。土日限定にすると祝日の振替開催
    # (月曜開催等)を取りこぼすため、平日は当日開催ゼロを検出して即終了する運用にする。
    # パブリックリポジトリで標準ランナー無料枠は実質無制限のため平日分のコストは無視できる。
    - cron: "0 23 * * *"   # 毎日 8:00 JST
    - cron: "0 4 * * *"    # 毎日 13:00 JST
  workflow_dispatch:
    inputs:
      window:
        description: "am または pm"
        required: true
        default: "am"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Determine window
        id: win
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "window=${{ inputs.window }}" >> "$GITHUB_OUTPUT"
          else
            # 実行時刻(起動遅延の影響を受ける)ではなく、発火したcron式そのもので判定する。
            # cronの遅延(10〜30分)によりUTC時刻ベースの判定だと誤判定するため。
            schedule="${{ github.event.schedule }}"
            case "$schedule" in
              "0 23 * * *") echo "window=am" >> "$GITHUB_OUTPUT" ;;
              "0 4 * * *")  echo "window=pm" >> "$GITHUB_OUTPUT" ;;
              *) echo "unknown schedule: $schedule"; exit 1 ;;
            esac
          fi

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python collector.py --window ${{ steps.win.outputs.window }}

      - name: Archive raw HTML
        if: always()
        run: |
          if [ -d raw_html ]; then
            tar -czf raw_html_$(date +%Y%m%d_%H%M).tar.gz raw_html
          fi

      - name: Upload raw HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html-${{ steps.win.outputs.window }}-${{ github.run_id }}
          path: raw_html_*.tar.gz
          retention-days: 90
          if-no-files-found: ignore
